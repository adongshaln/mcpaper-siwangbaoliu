order: 50
announcements:
  - id: chest
    title: 死亡保留
    pages:
      - |-
        死亡后，掉落的东西
        会装进原地的箱子。
        箱子标题是
        「你的名字的物品」。

        拿空之后，
        只有这个箱子会消失。
        普通箱子不受影响。
      - |-
        复活时，聊天栏会告诉你
        箱子的坐标。

        漏斗不能从这个箱子
        里抽东西。
        别人的普通箱子
        不会被这个功能拆掉。
  - id: experience
    title: 经验
    pages:
      - |-
        死亡后经验不再掉在地上。
        它会变成箱子里的
        一个经验瓶。

        拿起那个瓶子，
        经验就回到身上。
        普通的经验瓶不受影响。
